name: flutterscaffold
description: "慢慢：记录小习惯、专注时刻和生活手记的本地生活 APP"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  tdesign_flutter: ^0.2.7
  flutter_smart_dialog: ^5.3.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9

# 本地补丁兼容 Flutter 3.47 的 IconData,上游修复后移除覆盖。
dependency_overrides:
  tdesign_flutter:
    path: third_party/tdesign_flutter

flutter:
  uses-material-design: true
