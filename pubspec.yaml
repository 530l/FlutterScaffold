name: flutterscaffold
description: "A new Flutter scaffold project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  retrofit: ^4.10.0
  tdesign_flutter: ^0.2.7
  flutter_smart_dialog: ^5.3.0
  cached_network_image_ce: ^4.12.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  riverpod_generator: ^4.0.9

# 本地补丁兼容 Flutter 3.47 的 IconData,上游修复后移除覆盖。
dependency_overrides:
  tdesign_flutter:
    path: third_party/tdesign_flutter

flutter:
  uses-material-design: true
